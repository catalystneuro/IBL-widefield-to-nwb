Subject:
  species: Mus musculus
  strain: C57BL/6
  description: >
    Animals were housed under a 12 h–12 h light–dark cycle—either normal or inverted, depending
    on the laboratory—and had unrestricted access to food and water except on training days.
    Depending on the laboratory, electrophysiology recordings and behavioural training took place
    during either the light or dark phase of the cycle. In total, data were collected from 139
    adult C57BL/6 mice (94 male, 45 female), purchased from Jackson Laboratory or Charles River.
    On the day of electrophysiological recording, mice ranged in age from 13 to 178 weeks
    (mean 44.96 weeks; median 27.0 weeks) and weighed between 16.1 and 35.7 g (mean 23.9 g,
    median 23.84 g). Widefield calcium imaging was performed in a subset of 6 mice across
    52 sessions. All experimental procedures were conducted in accordance with local laws and
    approved by the relevant institutional ethics committees.
