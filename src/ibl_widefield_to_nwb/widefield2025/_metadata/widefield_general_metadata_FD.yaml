Subject:
  species: Mus musculus
  strain: C57BL/6
  description: >
    Constitutive Nrxn1α KO mice were obtained from the Fuccillo lab (University of Pennsylvania)
    and kept on a C57BL/6 background (Geppert et al. 1998). To transgenically express GCaMP6s,
    Nrxn1α +/- animals were subsequently crossed onto TRE-GCaMP6s (G6s2, JAX 024742) and mice
    expressing tTA under the control of the alpha isoform of calcium/calmodulin-dependent protein
    kinase type II alpha chain (CaMKII) promoter (JAX 003010). Offspring were weaned at P21 and
    separated by sex in cages of 2–5 animals of mixed genotypes. Wild-type littermates were used
    as controls. Adult male and female mice between the ages of 2–6 months were used for
    experiments. Mice were housed under a 12-h light/12-h dark reverse light cycle and provided
    food ad libitum. All mice were housed with enrichment in the form of mouse igloos with
    fast-tracs (Bio-Serv) and yogurt drops or peanuts. Animals used in experiments had not
    previously been involved in other experiments or exposed to any drugs. All experiments were
    conducted in accordance with the National Institute of Health Guidelines for the Use of Animals
    and approved by the Institutional Animal Care and Use Committee of the University of California
    at Los Angeles.
